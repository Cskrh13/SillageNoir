<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographe des Compétences — CP Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --fond: #0d1112; --bleu-noir: #1b2325; --bleu-ardoise: #2d393d;
    --parchemin-clair: #ded4b7; --texte-clair: #d8d1b8; --argent: #91a6aa;
    --ligne: rgba(125,139,140,.5); --or: #b7975c;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: radial-gradient(ellipse at 50% -10%, #1c2426 0%, var(--fond) 60%);
    color: var(--texte-clair); font-family: "Vollkorn", Georgia, serif; overflow: hidden;
}
header {
    position: relative; z-index: 5; padding: 18px 24px 14px; text-align: center;
    background: linear-gradient(rgba(13,17,18,.92), rgba(13,17,18,.7) 70%, transparent);
    border-bottom: 1px solid var(--ligne);
}
header h1 { margin: 0; font-family: "IM Fell English SC", Georgia, serif; font-weight: normal; font-size: clamp(20px, 3vw, 30px); letter-spacing: 3px; color: var(--parchemin-clair); }
header p { margin: 6px 0 0; color: var(--argent); font-size: 12.5px; letter-spacing: 1px; }

.bar {
    position: relative; z-index: 5; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center;
    padding: 10px 20px; background: rgba(27,35,37,.82); border-bottom: 1px solid var(--ligne); font-size: 12.5px;
}
.bar .domaine-filtre { display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 4px 9px; border: 1px solid var(--ligne); opacity: .55; }
.bar .domaine-filtre.actif { opacity: 1; background: rgba(183,151,92,.15); }
.bar .dot { width: 9px; height: 9px; border-radius: 50%; }
.bar input#searchInput { padding: 6px 10px; border: 1px solid var(--ligne); background: #12181a; color: var(--texte-clair); font-family: "Vollkorn", Georgia, serif; font-size: 12.5px; width: 190px; }

#graphZone { position: absolute; inset: 0; top: 0; }

.legend {
    position: absolute; left: 16px; bottom: 16px; z-index: 6; background: rgba(19,25,27,.88);
    border: 1px solid var(--ligne); padding: 12px 14px; font-size: 11.5px; max-width: 190px;
}
.legend h4 { margin: 0 0 7px; font-family: "IM Fell English SC", Georgia, serif; font-weight: normal; font-size: 12.5px; color: var(--parchemin-clair); }
.legend .row { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.legend .line { width: 16px; height: 0; border-top: 2px solid #d9a441; flex-shrink: 0; }

.panel {
    position: absolute; right: 0; top: 0; bottom: 0; z-index: 6; width: 380px; max-width: 92vw;
    background: rgba(15,20,21,.97); border-left: 1px solid var(--ligne); padding: 20px 22px;
    overflow-y: auto; transform: translateX(100%); transition: transform .25s ease;
}
.panel.visible { transform: translateX(0); }
.panel .close { position: absolute; top: 12px; right: 16px; cursor: pointer; color: var(--argent); font-size: 16px; }
.panel .domaine-tag { display: inline-block; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--ligne); margin-bottom: 8px; }
.panel h2 { margin: 4px 30px 4px 0; font-family: "IM Fell English SC", Georgia, serif; font-weight: normal; font-size: 20px; color: var(--parchemin-clair); letter-spacing: .5px; line-height: 1.3; }
.panel .objectif { font-size: 13.5px; color: var(--texte-clair); line-height: 1.55; margin-bottom: 14px; }
.panel .prereqs { font-size: 12px; color: var(--argent); margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--ligne); }
.panel .prereqs b { color: var(--or); }
.panel .prereqs a { color: var(--or); cursor: pointer; text-decoration: underline; }
.panel h3 { font-family: "IM Fell English SC", Georgia, serif; font-weight: normal; font-size: 14.5px; color: var(--parchemin-clair); letter-spacing: .5px; margin: 0 0 10px; }
.seance {
    padding: 10px 12px; margin-bottom: 8px; background: rgba(222,212,183,.06); border: 1px solid var(--ligne);
    border-left: 3px solid var(--or);
}
.seance .num { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--or); }
.seance .titre { font-size: 13.5px; font-weight: 600; color: var(--parchemin-clair); margin: 2px 0 4px; }
.seance .desc { font-size: 12.5px; color: var(--texte-clair); line-height: 1.5; }

.empty-state {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; text-align: center; color: var(--argent); pointer-events: none; padding: 40px;
}
.empty-state .sceau { font-family: "IM Fell English SC", Georgia, serif; font-size: 38px; letter-spacing: 5px; color: #3c4d50; }
.empty-state p { max-width: 420px; font-size: 13.5px; line-height: 1.6; margin: 0; }

@media(max-width: 720px){ .bar { font-size: 11px; gap: 8px; } .panel { width: 100%; } .legend { display: none; } }
</style>
</head>
<body>

<header>
    <h1>Cartographe des Compétences</h1>

</header>

<div class="bar" id="filtres"></div>

    <div class="empty-state" id="emptyState">

<div class="panel" id="panel">

<script src="https://unpkg.com/3d-force-graph@1"></script>
<script>

const byId = {}; COMPETENCES.forEach(c => byId[c.id] = c);

/* =========================================================
   FILTRES PAR DOMAINE
   ========================================================= */
let domainesActifs = new Set(Object.keys(DOMAINES));

function construireFiltres(){
    const zone = $("filtres");
    zone.innerHTML = Object.entries(DOMAINES).map(([key, d]) => `
        <span class="domaine-filtre actif" data-domaine="${key}" onclick="toggleDomaine('${key}')">
            <span class="dot" style="background:${d.couleur}"></span>${d.label}
        </span>`).join("") + `<input type="text" id="searchInput" placeholder="Filtrer une compétence…">`;
    $("searchInput").addEventListener("input", e => filtrerRecherche(e.target.value));
}
function toggleDomaine(key){
    if(domainesActifs.has(key)) domainesActifs.delete(key); else domainesActifs.add(key);
    document.querySelector(`.domaine-filtre[data-domaine="${key}"]`).classList.toggle("actif");
    reconstruireGraphe();
}
function filtrerRecherche(q){
    q = q.trim().toLowerCase();
    if(!Graph) return;
    Graph.nodeColor(n => {
        const base = DOMAINES[n.domaine].couleur;
        if(!q) return base;
        return (n.nom.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)) ? "#ffffff" : "#2a3234";
    });
}

function construireLegende(){
    $("legendRows").innerHTML = Object.values(DOMAINES).map(d =>
        `<div class="row"><span class="dot" style="background:${d.couleur}"></span>${d.label}</div>`).join("");
}

/* =========================================================
   GRAPHE 3D
   ========================================================= */
let Graph = null;

function construireDonneesGraphe(){
    const actives = COMPETENCES.filter(c => domainesActifs.has(c.domaine));
    const idsActifs = new Set(actives.map(c => c.id));
    const nodes = actives.map(c => ({ id: c.id, nom: c.nom, domaine: c.domaine }));
    const links = [];
    actives.forEach(c => c.prereqs.forEach(p => {
        if(idsActifs.has(p)) links.push({ source: p, target: c.id });
    }));
    return { nodes, links };
}

function tailleNoeud(n, links){
    const deg = links.filter(l => l.source === n.id || l.target === n.id || (l.source && l.source.id === n.id) || (l.target && l.target.id === n.id)).length;
    return 4 + Math.min(deg, 10) * 0.7;
}

function construireGraphe(){
    const { nodes, links } = construireDonneesGraphe();
    nodes.forEach(n => n.val = tailleNoeud(n, links));
    $("graphZone").innerHTML = "";
    $("emptyState").style.display = nodes.length ? "none" : "flex";
    if(!nodes.length){ Graph = null; return; }
    const zone = document.createElement("div");
    zone.style.position = "absolute"; zone.style.inset = "0";
    $("graphZone").appendChild(zone);
    $("graphZone").appendChild($("emptyState"));

    Graph = ForceGraph3D()(zone)
        .backgroundColor("rgba(0,0,0,0)")
        .graphData({ nodes, links })
        .nodeLabel(n => `${n.nom} (${DOMAINES[n.domaine].label})`)
        .nodeColor(n => DOMAINES[n.domaine].couleur)
        .linkColor(() => "#d9a441")
        .linkOpacity(0.75)
        .linkWidth(1.2)
        .linkDirectionalArrowLength(3.5)
        .linkDirectionalArrowRelPos(1)
        .linkCurvature(0.12)
        .onNodeClick(n => { ouvrirFiche(n.id); centrerSur(n); })
        .onBackgroundClick(fermerFiche);

    Graph.d3Force("charge").strength(-70);
}
function reconstruireGraphe(){ construireGraphe(); }

function centrerSur(n){
    const dist = 80;
    const ratio = 1 + dist/Math.hypot(n.x||1, n.y||1, n.z||1);
    Graph.cameraPosition({ x:(n.x||0.1)*ratio, y:(n.y||0.1)*ratio, z:(n.z||0.1)*ratio }, n, 700);
}

/* =========================================================
   PANNEAU FICHE COMPÉTENCE
   ========================================================= */
function ouvrirFiche(id){
    const c = byId[id];
    if(!c) return;
    const d = DOMAINES[c.domaine];
    const prereqsHTML = c.prereqs.length
        ? c.prereqs.map(p => `<a onclick="ouvrirFiche('${p}')">${byId[p].nom}</a>`).join(", ")
        : "aucun — compétence fondatrice";
    $("panelContent").innerHTML = `
        <span class="domaine-tag" style="border-color:${d.couleur};color:${d.couleur}">${d.label}</span>
        <h2>${c.nom}</h2>
        <div class="objectif">${c.objectif}</div>
        <div class="prereqs">Prérequis : <b>${c.prereqs.length}</b> — ${prereqsHTML}</div>
        <h3>Séquence — 7 séances</h3>
        ${c.seances.map((s,i) => `
            <div class="seance">
                <div class="num">Séance ${i+1} · ${s.titre}</div>
                <div class="desc">${s.desc}</div>
            </div>`).join("")}
    `;
    $("panel").classList.add("visible");
}
function fermerFiche(){ $("panel").classList.remove("visible"); }
$("panelClose").addEventListener("click", fermerFiche);

/* =========================================================
   INIT
   ========================================================= */
construireFiltres();
construireLegende();
construireGraphe();
</script>
</body>
</html>
