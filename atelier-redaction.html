<style>
:root {
    --fond: #15191a;
    --bleu-noir: #1b2325;
    --bleu-ardoise: #2d393d;
    --parchemin: #c8bd9d;
    --parchemin-clair: #ded4b7;
    --encre: #252a29;
    --texte-clair: #d8d1b8;
    --argent: #91a6aa;
    --ligne: rgba(125,139,140,.5);
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: linear-gradient(rgba(170,145,105,.72), rgba(170,145,105,.72)), url("images/fond-carte.jpg");
    background-size: cover;
    background-attachment: fixed;
    color: var(--encre);
    font-family: "Vollkorn", Georgia, serif;
}
button, input, select, textarea { font-family: "Vollkorn", Georgia, serif; }
button { cursor: pointer; }
.page { width: calc(100% - 40px); max-width: 1300px; margin: 35px auto; }
header {
    padding: 34px; text-align: center; color: var(--texte-clair);
    background: linear-gradient(rgba(25,32,34,.94), rgba(30,38,40,.94)), url("images/fond-carte.jpg");
    background-size: cover; border: 1px solid var(--ligne);
}
header h1 { margin: 0; font-family: "IM Fell English SC", Georgia, serif; font-size: clamp(28px, 4.5vw, 50px); font-weight: normal; letter-spacing: 4px; }
header p { margin: 10px 0 0; color: #aaa89b; letter-spacing: 2px; font-size: 13px; }

/* -------- Barre page (métadonnées + import/export) -------- */
.page-bar {
    margin-top: 20px; padding: 18px 22px; background: rgba(222,212,183,.95);
    border: 1px solid var(--ligne); display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
}
.page-bar .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
.page-bar label { font-weight: 600; font-size: 12px; color: #363b39; text-transform: uppercase; letter-spacing: 1px; }
.page-bar input { padding: 9px 10px; border: 1px solid #9c9278; background: #eee7d1; color: #252a29; font-size: 14px; }
.page-bar .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

button.action {
    padding: 9px 14px; border: 1px solid #596365; background: var(--bleu-noir);
    color: var(--texte-clair); font-family: "IM Fell English SC", Georgia, serif;
    letter-spacing: .5px; font-size: 13px;
}
button.action:hover { background: var(--bleu-ardoise); }
button.action.ok { background: #3c4f40; }
button.action.danger { background: #5c3230; }
button.action.small { padding: 5px 9px; font-size: 12px; }
button.action:disabled { opacity: .4; cursor: not-allowed; }

.status-line { margin-top: 8px; color: #4a4530; font-size: 13px; min-height: 18px; }

/* -------- Corps : liste de blocs + éditeur -------- */
.workzone { margin-top: 20px; display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
.blocs-list {
    background: rgba(222,212,183,.95); border: 1px solid var(--ligne); padding: 16px;
}
.blocs-list h2 { margin: 0 0 12px; font-family: "IM Fell English SC", Georgia, serif; font-size: 18px; letter-spacing: 1px; }
.add-bloc { display: flex; gap: 6px; margin-bottom: 14px; }
.add-bloc select { flex: 1; padding: 8px; border: 1px solid #9c9278; background: #eee7d1; font-size: 13px; }
.bloc-item {
    display: flex; flex-direction: column; gap: 6px; padding: 10px; margin-bottom: 8px;
    background: #eee7d1; border: 1px solid #9c9278; cursor: pointer;
}
.bloc-item.active { border-color: #56442d; background: #e4d8b3; }
.bloc-item .titre-item { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
.bloc-item .type-item { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6b6350; }
.bloc-item .controls { display: flex; gap: 4px; flex-wrap: wrap; }
.bloc-item .controls button {
    padding: 4px 7px; font-size: 11px; border: 1px solid #9c9278; background: #ded4b7; color: #252a29;
}
.bloc-item .controls button:hover { background: #cfc19a; }
.empty-hint { font-size: 13px; color: #56442d; padding: 8px 2px; }

.editor-col { display: flex; flex-direction: column; gap: 18px; }
.editor {
    padding: 24px; background: rgba(222,212,183,.95); border: 1px solid var(--ligne);
}
.editor h2 { margin: 0 0 4px; font-family: "IM Fell English SC", Georgia, serif; font-size: 20px; letter-spacing: 1px; }
.editor .subtitle-editor { margin: 0 0 16px; font-size: 12px; color: #6b6350; text-transform: uppercase; letter-spacing: 1px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
label { font-weight: 600; color: #363b39; font-size: 13px; }
input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #9c9278; background: #eee7d1;
    color: #252a29; font-size: 14px;
}
textarea { min-height: 80px; resize: vertical; }

/* -------- Éditeur de texte enrichi (police / taille / couleur / gras / italique par sélection) -------- */
.rich-field { border: 1px solid #9c9278; background: #eee7d1; }
.rich-toolbar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px; background: #ded4b7; border-bottom: 1px solid #9c9278;
}
.rich-toolbar select, .rich-toolbar input[type="number"] {
    width: auto; padding: 6px 8px; font-size: 12.5px; border: 1px solid #9c9278; background: #fff;
}
.rich-toolbar select { min-width: 150px; }
.rich-toolbar input[type="color"] {
    width: 34px; height: 32px; padding: 2px; border: 1px solid #9c9278; background: #fff; cursor: pointer;
}
.rich-toolbar button {
    padding: 6px 11px; font-size: 12.5px; border: 1px solid #9c9278; background: #f3ecd8; color: #252a29; cursor: pointer;
}
.rich-toolbar button:hover { background: #e4d8b3; }
.rich-editable {
    min-height: 90px; padding: 10px 12px; background: #fdfbf2; color: #252a29;
    font-size: 14px; line-height: 1.5; outline: none;
}
.rich-editable:focus { box-shadow: inset 0 0 0 2px #9c9278; }
.rich-hint { font-size: 11.5px; color: #6b6350; margin-top: 5px; }
@media(max-width: 900px) { .grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } .workzone { grid-template-columns: 1fr; } }

.sub-list { margin-top: 16px; border-top: 1px dashed #9c9278; padding-top: 14px; }
.sub-list h4 { margin: 0 0 10px; font-size: 14px; }
.sub-item {
    padding: 12px; margin-bottom: 10px; background: #e4d8b3; border: 1px solid #9c9278;
    display: flex; flex-direction: column; gap: 8px;
}
.sub-item .sub-head { display: flex; justify-content: space-between; align-items: center; }
.sub-item .sub-head span { font-weight: 600; font-size: 13px; }
.sub-item .sub-controls { display: flex; gap: 4px; }
.sub-item .sub-controls button {
    padding: 3px 7px; font-size: 11px; border: 1px solid #9c9278; background: #ded4b7;
}


/* -------- Navigation éditoriale -------- */
.p-nav{width:100%;max-width:980px;background:rgba(231,222,199,.95);border:1px solid var(--ligne);box-shadow:0 4px 13px rgba(45,35,24,.18);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative}
.p-nav::before,.p-nav::after{content:"";position:absolute;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,#8a7859,transparent)}.p-nav::before{top:6px}.p-nav::after{bottom:6px}
.p-nav-brand{display:flex;flex-direction:column;gap:2px}.p-nav-brand strong{font-family:"IM Fell English SC",Georgia,serif;font-size:20px;font-weight:400}.p-nav-brand span{font-family:"Cinzel",Georgia,serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7859}.p-nav-links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}.p-nav-links a{padding:8px 10px;font-family:"Cinzel",Georgia,serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#554936;border-bottom:1px solid transparent}.p-nav-links a.active{color:#292824;border-bottom-color:#9b8151}.p-nav-links a:hover{background:rgba(138,120,89,.1)}@media(max-width:700px){.p-nav{flex-direction:column;text-align:center}.p-nav-links{justify-content:center}}

/* -------- Aperçu : styles réels du site -------- */
.preview-label {
    margin-top: 6px; text-transform: uppercase; letter-spacing: 2px; font-size: 12px;
    color: #56442d; text-align: center;
}
.preview-frame {
    margin-top: 10px; padding: 30px 25px; background: linear-gradient(rgba(170,145,105,.72), rgba(170,145,105,.72)), url("images/fond-carte.jpg");
    background-size: cover; border: 1px solid var(--ligne); display: flex; flex-direction: column; gap: 26px; align-items: center;
}
.preview-empty { color: #56442d; font-size: 13px; padding: 20px; }

/* classes réelles reproduites (issues de index.html) */
.p-hero {
    width: 100%; max-width: 780px; padding: 26px 30px; text-align: center;
    background: rgba(25,32,34,.94); border: 1px solid var(--ligne); color: var(--texte-clair);
}
.p-hero h3 { margin: 0 0 8px; text-transform: uppercase; letter-spacing: 2px; font-family: "IM Fell English SC", Georgia, serif; font-weight: normal; }
.p-hero p { font-size: 14px; margin: 10px 0; }
.p-texte { width: 100%; max-width: 780px; padding: 10px 6px; }
.p-texte h3 { font-family: var(--police-titres, "IM Fell English SC", Georgia, serif); font-size: var(--taille-titres, 15px); font-weight: normal; letter-spacing: 1px; margin: 0 0 10px; color: var(--couleur-titres, #252a29); }
.p-texte.centre { text-align: center; }
.p-texte p { font-size: var(--taille-texte, 12px); line-height: 1.6; margin: 0 0 10px; color: var(--couleur-texte, #3a352a); font-family: var(--police-texte, "Vollkorn", Georgia, serif); }
.p-image { width: 100%; max-width: 780px; text-align: center; }
.p-image img { width: 100%; max-height: 340px; object-fit: cover; border: 1px solid var(--ligne); }
.p-image figcaption { margin-top: 8px; font-size: 12px; color: #56442d; }
.p-grille-titre { font-family: var(--police-titres, "IM Fell English SC", Georgia, serif); font-weight: normal; letter-spacing: 2px; text-align: center; margin: 0 0 4px; color: var(--couleur-titres, #252a29); }
.p-grille-sep { width: 80px; height: 1px; background: var(--ligne); margin: 0 auto 20px; }
.p-grille { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 900px; }
.card {
    background: rgba(222,212,183,.95); border: 1px solid var(--ligne); padding: 18px;
    max-width: 260px; text-align: center;
}
.card h3 { font-family: var(--police-titres, "IM Fell English SC", Georgia, serif); font-weight: normal; letter-spacing: 1px; margin: 0 0 10px; color: var(--couleur-titres, #252a29); }
.card-carte-image { width: 100%; height: 150px; object-fit: cover; border: 1px solid var(--ligne); background: #202829; }
.card p { font-size: var(--taille-texte, 13px); line-height: 1.5; margin: 12px 0; color: var(--couleur-texte, #3a352a); font-family: var(--police-texte, "Vollkorn", Georgia, serif); }
.button {
    display: inline-block; padding: 9px 16px; border: 1px solid #596365; background: var(--couleur-accent, var(--bleu-noir));
    color: var(--texte-clair); font-family: var(--police-titres, "IM Fell English SC", Georgia, serif); letter-spacing: 1px;
    text-decoration: none; text-transform: uppercase; font-size: 13px;
}
.button.disabled { opacity: .5; pointer-events: none; }
.p-fiche { width: 100%; max-width: 780px; background: rgba(222,212,183,.95); border: 1px solid var(--ligne); padding: 24px; }
.p-fiche .fiche-image { width: 100%; max-height: 260px; object-fit: cover; border: 1px solid var(--ligne); margin-bottom: 16px; }
.p-fiche h2 { font-family: var(--police-titres, "IM Fell English SC", Georgia, serif); font-weight: normal; letter-spacing: 2px; margin: 0 0 4px; text-align: center; color: var(--couleur-titres, #252a29); }
.p-fiche .sous-titre { text-align: center; font-size: 13px; color: #6b6350; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.p-fiche .accroche { text-align: center; font-style: italic; margin-bottom: 18px; color: #3a352a; }
.p-fiche .fiche-section { margin-top: 16px; border-top: 1px dashed #9c9278; padding-top: 14px; }
.p-fiche .fiche-section h4 { font-family: var(--police-titres, "IM Fell English SC", Georgia, serif); font-weight: normal; margin: 0 0 8px; letter-spacing: .5px; color: var(--couleur-titres, #252a29); }
.p-fiche .fiche-section p { font-size: var(--taille-texte, 14px); line-height: 1.6; color: var(--couleur-texte, #3a352a); margin: 0; white-space: pre-wrap; font-family: var(--police-texte, "Vollkorn", Georgia, serif); }

.p-carrousel-wrap { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.p-carrousel-vignettes { display: flex; gap: 10px; background: var(--bleu-noir); border: 1px solid var(--ligne); padding: 12px; width: 100%; justify-content: center; flex-wrap: wrap; }
.p-vignette { width: 70px; text-align: center; }
.p-vignette img, .p-vignette-vide { width: 100%; height: 60px; object-fit: cover; border: 1px solid var(--ligne); background: #202829; }
.p-vignette span { display: block; margin-top: 5px; font-size: 10px; color: var(--texte-clair); text-transform: uppercase; letter-spacing: .5px; }
.p-carrousel-slide {
    width: 100%; background: var(--bleu-noir); border: 1px solid var(--ligne); color: var(--texte-clair);
    display: flex; align-items: center; padding: 30px; gap: 24px; position: relative;
}
.p-carrousel-texte { flex: 1; text-align: left; }
.p-carrousel-texte h3 { font-family: "IM Fell English SC", Georgia, serif; font-weight: normal; letter-spacing: 1px; margin: 0 0 10px; }
.p-carrousel-texte p { font-size: 14px; margin: 0 0 16px; color: #cfc7ab; }
.p-carrousel-image { width: 200px; flex-shrink: 0; }
.p-carrousel-image img { width: 100%; border: 1px solid #b7975c; }
.p-carrousel-fleche { background: none; border: none; color: var(--texte-clair); font-size: 22px; cursor: default; padding: 0 6px; }
.p-carrousel-dots { display: flex; gap: 6px; }
.p-dot { width: 8px; height: 8px; border-radius: 50%; background: #9c9278; display: inline-block; }
.p-dot.active { background: #56442d; }
@media(max-width: 650px) { .p-carrousel-slide { flex-direction: column; } }

.p-footer { width: 100%; max-width: 900px; padding: 22px 24px; text-align: center; background: rgba(25,32,34,.94); border: 1px solid var(--ligne); color: var(--texte-clair); }
.p-footer p { font-size: 13px; margin: 0 0 10px; color: #cfc7ab; }
.p-footer-liens { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.p-footer-lien { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--texte-clair); }

/* Images insérées dans un champ de texte riche : toujours responsives */
.rich-editable img, .p-texte img, .p-hero img, .card img, .p-fiche .fiche-section img, .p-carrousel-texte img, .p-footer img { max-width: 100%; height: auto; display: block; margin: 8px 0; border: 1px solid var(--ligne, #9c9278); }

.output { margin-top: 25px; }
.output label { display: block; margin-bottom: 8px; }
.output textarea {
    min-height: 280px; background: #15191a; color: #d8d1b8;
    font-family: Consolas, monospace; font-size: 12.5px;
}
@media(max-width:650px) {
    .page-wrap { width: calc(100% - 20px); max-width: none; min-height: auto; }
    .p-hero, .p-texte, .p-fiche { padding: 20px; }
    .p-carrousel-slide { flex-direction: column; }
    .p-carrousel-image { width: min(100%, 300px); }
    .p-carrousel-vignettes { overflow-x: auto; }
    .p-grille-grid { grid-template-columns: 1fr; }
}

<script>
const $ = id => document.getElementById(id);

/* =========================================================
   DÉFINITION DES TYPES DE BLOCS
   Chaque type expose : label, defaultData(), form(bloc,i) -> html,
   preview(bloc) -> html
   ========================================================= */
function esc(s){ return String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function alignCss(valeur){
    return { gauche:"left", centre:"center", droite:"right" }[valeur] || "left";
}
function slugify(t){
    return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

const BLOC_TYPES = {

    nav: {
        label: "Navigation du site",
        defaultData: () => ({ type:"nav", titre:"Archives de l’Ancien Monde", sousTitre:"", liens:[{label:"Accueil",url:"index.html",actif:true},{label:"Suppléments",url:"#supplements",actif:false},{label:"Archives",url:"archives.html",actif:false}] }),

            <div class="grid">

            <button class="action small" onclick="ajouterLienNav(${i})">＋ Ajouter un lien</button></div>`,
        preview: b => `<nav class="p-nav"><div class="p-nav-brand"><strong>${esc(b.titre||'Archives de l’Ancien Monde')}</strong>${b.sousTitre?`<span>${esc(b.sousTitre)}</span>`:''}</div><div class="p-nav-links">${(b.liens||[]).map(l=>`<a class="${l.actif?'active':''}">${esc(l.label||'Lien')}</a>`).join('')}</div></nav>`
    },

    hero: {
        label: "Bandeau (actualité / mise en avant)",
        defaultData: () => ({ type:"hero", titre:"Actualité", sousTitre:"", texte:"", lien:"", boutonLabel:"Télécharger" }),
        form: (b,i) => `
            <div class="grid">
                <div class="field"><label>Titre du bloc</label><input value="${esc(b.titre)}" oninput="updateBloc(${i},'titre',this.value)"></div>
                <div class="field"><label>Sous-titre</label><input value="${esc(b.sousTitre)}" oninput="updateBloc(${i},'sousTitre',this.value)"></div>
                <div class="field full">
                    <label>Texte</label>
                    ${champRiche("hero_"+i, b.texte, html => { page.blocs[i].texte = html; renderListeSeule(); })}

                <div class="field"><label>Lien du bouton</label><input value="${esc(b.lien)}" placeholder="https://..." oninput="updateBloc(${i},'lien',this.value)"></div>
                <div class="field"><label>Texte du bouton</label><input value="${esc(b.boutonLabel)}" oninput="updateBloc(${i},'boutonLabel',this.value)"></div>

        preview: b => `
            <div class="p-hero">
                <h3>${esc(b.titre||"Actualité")}</h3>
                ${b.sousTitre?`<p><strong>${esc(b.sousTitre)}</strong></p>`:""}
                ${versHTMLCorps(b.texte||"")}

    texte: {

    "grille-cartes": {
        label: "Grille de cartes (suppléments, cartes de référence...)",

                            <div class="field"><label>Statut</label>

                            </div>
                            <div class="field full">

                                ${champRiche("carte_"+i+"_"+ci, c.description, html => { page.blocs[i].cartes[ci].description = html; })}
                            </div>
                            <div class="field"><label>Image</label><input value="${esc(c.image)}" placeholder="images/couverture.png" oninput="updateCarte(${i},${ci},'image',this.value)"></div>
                            <div class="field"><label>Lien</label><input value="${esc(c.lien)}" oninput="updateCarte(${i},${ci},'lien',this.value)"></div>

                    </div>`).join("") || `<div class="empty-hint">Aucune carte pour l'instant.</div>`}
                <button class="action small" onclick="ajouterCarte(${i})">＋ Ajouter une carte</button>
            </div>`,
        preview: b => `
            <div class="p-image" style="max-width:900px">
                <h3 class="p-grille-titre">${esc(b.titre||"Cartes de références")}</h3>

                    ${(b.cartes||[]).length ? (b.cartes||[]).map(c=>{
                        const boutonLabel = c.statut==="disponible"?"Télécharger":c.statut==="bientot"?"Bientôt disponible":"Archivé";
                        const disabled = c.statut!=="disponible";

                            <h3>${esc(c.nom||"Titre")}</h3>

    "fiche-detaillee": {
        label: "Fiche détaillée (armée, supplément, campagne...)",

        form: (b,i) => `

    carrousel: {

                <button class="action small" onclick="ajouterLienPied(${i})">＋ Ajouter un lien</button>
            </div>`,
        preview: b => `

/* -------- Texte enrichi (sélection partielle : police / taille / couleur / gras / italique) --------
   Généralisé à toute "partie de texte libre" via un identifiant de champ (fieldId) unique
   sous forme de chaîne (ex: "texte_0", "hero_2", "carte_1_3", "section_0_1"...). Chaque champ
   riche est déclaré avec un getter/setter enregistré dans richFields au moment du rendu du
   formulaire, ce qui permet à un seul jeu de fonctions de piloter tous les champs riches. */
const savedRanges = {};
const richFields = {};

function versHTMLCorps(corps){
    if(!corps) return "";
    if(/<[a-z][\s\S]*>/i.test(corps)) return corps;
    return corps.split(/\n\s*\n/).filter(p=>p.trim()).map(p=>`<p>${esc(p.trim())}</p>`).join("");
}

function enregistrerChampRiche(fieldId, onChange){
    richFields[fieldId] = { onChange };
}

function champRiche(fieldId, valeur, onChange){
    enregistrerChampRiche(fieldId, onChange);
    const html = versHTMLCorps(valeur);
    return `
        <div class="rich-field">
        <div class="rich-toolbar">
            <select onmousedown="event.preventDefault();restaurerSelection('${fieldId}')" onchange="richPolice('${fieldId}',this.value)">
                <option value="">Police (sélection)…</option>
                <option value="'Vollkorn', Georgia, serif" style="font-family:'Vollkorn', Georgia, serif">Vollkorn</option>
                <option value='"IM Fell English SC", Georgia, serif' style='font-family:"IM Fell English SC", Georgia, serif'>IM Fell English SC</option>
                <option value="'Cinzel', Georgia, serif" style="font-family:'Cinzel', Georgia, serif">Cinzel</option>
                <option value="'EB Garamond', Georgia, serif" style="font-family:'EB Garamond', Georgia, serif">EB Garamond</option>
                <option value="'Crimson Text', Georgia, serif" style="font-family:'Crimson Text', Georgia, serif">Crimson Text</option>
                <option value="'MedievalSharp', Georgia, serif" style="font-family:'MedievalSharp', Georgia, serif">MedievalSharp</option>
                <option value="'Merriweather', Georgia, serif" style="font-family:'Merriweather', Georgia, serif">Merriweather</option>
                <option value="'Playfair Display', Georgia, serif" style="font-family:'Playfair Display', Georgia, serif">Playfair Display</option>
                <option value="Georgia, serif" style="font-family:Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif" style="font-family:'Times New Roman', serif">Times New Roman</option>
                <option value="Arial, sans-serif" style="font-family:Arial, sans-serif">Arial</option>
                <option value="'Courier New', monospace" style="font-family:'Courier New', monospace">Courier New</option>
            </select>
            <select onmousedown="event.preventDefault();restaurerSelection('${fieldId}')" onchange="richTaille('${fieldId}',this.value)">
                <option value="">Taille (sélection)…</option>
                <option value="8">Petit</option>
                <option value="12">Moyen</option>
                <option value="14">Grand</option>
            </select>
            <input type="color" value="#3a352a" title="Couleur du texte sélectionné" onmousedown="restaurerSelection('${fieldId}')" onchange="richCouleur('${fieldId}',this.value)">
            <button type="button" onmousedown="event.preventDefault()" onclick="richCommande('${fieldId}','bold')"><strong>G</strong></button>
            <button type="button" onmousedown="event.preventDefault()" onclick="richCommande('${fieldId}','italic')"><em>I</em></button>
            <button type="button" onmousedown="event.preventDefault()" onclick="richImage('${fieldId}')" title="Insérer une image">🖼️ Image</button>
            <button type="button" onmousedown="event.preventDefault()" onclick="richEffacerStyle('${fieldId}')">Effacer le style</button>
        </div>
        <div class="rich-editable" id="richCorps_${fieldId}" contenteditable="true"
             onmouseup="sauvegarderSelection('${fieldId}')" onkeyup="sauvegarderSelection('${fieldId}')"
             oninput="syncRichCorps('${fieldId}')" onpaste="richColler(event,'${fieldId}')">${html}</div>
        </div>
        <div class="rich-hint">Sélectionnez du texte dans le champ ci-dessus (y compris du texte déjà surligné/sélectionné), puis choisissez une police, une taille ou une couleur pour l'appliquer uniquement à cette sélection. Le bouton « Image » insère une image depuis une URL, et coller un lien d'image l'affiche directement.</div>`;
}

function sauvegarderSelection(fieldId){
    const div = $("richCorps_"+fieldId);
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return;
    const range = sel.getRangeAt(0);
    if(div && div.contains(range.commonAncestorContainer) && !range.collapsed){
        savedRanges[fieldId] = range.cloneRange();
    }
}

function restaurerSelection(fieldId){
    const range = savedRanges[fieldId];
    if(!range) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
}

function syncRichCorps(fieldId){
    const div = $("richCorps_"+fieldId);
    const champ = richFields[fieldId];
    if(!div || !champ) return;
    champ.onChange(div.innerHTML);
    majApercu();
    majOutput();
}

function richCommande(fieldId, commande){
    const div = $("richCorps_"+fieldId);
    restaurerSelection(fieldId);
    if(!window.getSelection().toString()){ alert("Sélectionnez d'abord du texte dans le champ à modifier."); return; }
    div.focus();
    /* execCommand bascule nativement : si la sélection est déjà entièrement en gras/italique,
       elle retire le style ; sinon elle l'applique à toute la sélection. */
    document.execCommand(commande, false, null);
    syncRichCorps(fieldId);
}

function richPolice(fieldId, police){
    if(!police) return;
    const div = $("richCorps_"+fieldId);
    restaurerSelection(fieldId);
    if(!window.getSelection().toString()){ alert("Sélectionnez d'abord du texte dans le champ à modifier."); return; }
    div.focus();
    document.execCommand("fontName", false, police);
    syncRichCorps(fieldId);
}

function richCouleur(fieldId, couleur){
    const div = $("richCorps_"+fieldId);
    restaurerSelection(fieldId);
    if(!window.getSelection().toString()){ alert("Sélectionnez d'abord du texte dans le champ à modifier."); return; }
    div.focus();
    document.execCommand("foreColor", false, couleur);
    syncRichCorps(fieldId);
}

function richTaille(fieldId, taille){
    if(!taille) return;
    const div = $("richCorps_"+fieldId);
    restaurerSelection(fieldId);
    const sel = window.getSelection();
    if(!sel.toString()){ alert("Sélectionnez d'abord du texte dans le champ à modifier."); return; }
    const range = sel.getRangeAt(0);
    const span = document.createElement("span");
    span.style.fontSize = taille + "px";
    try{
        range.surroundContents(span);
    }catch(e){
        const contenu = range.extractContents();
        span.appendChild(contenu);
        range.insertNode(span);
    }
    syncRichCorps(fieldId);
}

function richEffacerStyle(fieldId){
    const div = $("richCorps_"+fieldId);
    restaurerSelection(fieldId);
    if(!window.getSelection().toString()){ alert("Sélectionnez d'abord du texte dans le champ à modifier."); return; }
    div.focus();
    document.execCommand("removeFormat", false, null);
    syncRichCorps(fieldId);
}

/* -------- Images dans le texte riche (bouton "Image" + collage direct d'un lien) -------- */
function inserer_image_a_la_selection(div, url){
    const inseree = document.execCommand("insertImage", false, url);
    if(!inseree){
        const sel = window.getSelection();
        const img = document.createElement("img");
        img.src = url;
        if(sel && sel.rangeCount && div.contains(sel.getRangeAt(0).commonAncestorContainer)){
            const range = sel.getRangeAt(0);
            range.deleteContents();
            range.insertNode(img);
            range.collapse(false);
        } else {
            div.appendChild(img);
        }
    }
}

function richImage(fieldId){
    const div = $("richCorps_"+fieldId);
    const url = prompt("URL de l'image à insérer :");
    if(!url || !url.trim()) return;
    div.focus();
    restaurerSelection(fieldId);
    inserer_image_a_la_selection(div, url.trim());
    syncRichCorps(fieldId);
}

function estUrlImage(texte){
    return /^https?:\/\/\S+\.(png|jpe?g|gif|webp|svg|avif)(\?\S*)?$/i.test((texte||"").trim());
}

function richColler(evenement, fieldId){
    const donnees = evenement.clipboardData || window.clipboardData;
    const texte = donnees ? donnees.getData("text/plain") : "";
    if(texte && estUrlImage(texte)){
        evenement.preventDefault();
        const div = $("richCorps_"+fieldId);
        div.focus();
        inserer_image_a_la_selection(div, texte.trim());
        syncRichCorps(fieldId);
    }
    /* sinon : collage par défaut du navigateur (texte simple). */
}

function nomAffiche(b){
    if(b.type==="hero") return b.titre || "Bandeau";
    if(b.type==="texte") return b.titre || "Bloc texte";
    if(b.type==="image") return b.legende || "Image";
    if(b.type==="grille-cartes") return b.titre || "Grille de cartes";
    if(b.type==="fiche-detaillee") return b.titre || "Fiche détaillée";
    if(b.type==="carrousel") return "Carrousel (" + (b.slides||[]).length + " supplément(s))";
    if(b.type==="pied-de-page") return "Pied de page";
    return b.type;
}

function renderListeSeule(){
    const zone = $("blocsListe");
    if(!page.blocs.length){
        zone.innerHTML = `<div class="empty-hint">Aucun bloc. Ajoutez-en un ci-dessus.</div>`;
        return;
    }
    zone.innerHTML = page.blocs.map((b,i)=>`
        <div class="bloc-item ${i===selectedIndex?"active":""}" onclick="selectionnerBloc(${i})">
            <div class="titre-item"><span>${esc(nomAffiche(b))}</span></div>
            <div class="type-item">${esc(BLOC_TYPES[b.type]?.label||b.type)}</div>
            <div class="controls">
                <button onclick="event.stopPropagation();deplacerBloc(${i},-1)" ${i===0?"disabled":""}>↑</button>
                <button onclick="event.stopPropagation();deplacerBloc(${i},1)" ${i===page.blocs.length-1?"disabled":""}>↓</button>
                <button onclick="event.stopPropagation();dupliquerBloc(${i})">Dupliquer</button>
                <button onclick="event.stopPropagation();supprimerBloc(${i})">Suppr.</button>
            </div>
        </div>`).join("");
}

function renderEditeur(){
    const zone = $("editorZone");
    if(selectedIndex===null || !page.blocs[selectedIndex]){
        zone.innerHTML = `<div class="empty-hint">Sélectionnez un bloc à gauche, ou ajoutez-en un nouveau.</div>`;
        return;
    }
    const b = page.blocs[selectedIndex];
    const def = BLOC_TYPES[b.type];
    zone.innerHTML = `
        <h2>${esc(def.label)}</h2>
        <div class="subtitle-editor">Bloc n°${selectedIndex+1} sur ${page.blocs.length}</div>
        ${def.form(b, selectedIndex)}`;
}

function majApercu(){
    const zone = $("previewFrame");
    if(!page.blocs.length){
        zone.innerHTML = `<div class="preview-empty">La page est vide pour l'instant.</div>`;
        return;
    }
    zone.innerHTML = page.blocs.map(b=>{
        const def = BLOC_TYPES[b.type];
        return def ? def.preview(b) : "";
    }).join("");
}

function majOutput(){
    const clean = { id: page.id, titre: page.titre, description: page.description, format: page.format || "site", style: page.style || styleParDefaut(), blocs: page.blocs };
    $("outputText").value = JSON.stringify(clean, null, 2);
}

function renderTout(){
    renderListeSeule();
    renderEditeur();
    majApercu();
    appliquerStyleApercu();
    majOutput();
}

function exporterJSON(){
    if(!page.id){ alert("Renseignez un identifiant de page (slug) avant d'exporter."); return; }
    const clean = { id: page.id, titre: page.titre, description: page.description, format: page.format || "site", style: page.style || styleParDefaut(), blocs: page.blocs };
    const blob = new Blob([JSON.stringify(clean,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (page.id === "page-accueil" ? "page-accueil" : page.id) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    status(`Fichier téléchargé : ${a.download} — à déposer dans data/pages/ (ou data/ pour page-accueil.json).`);
}
async function copierJSON(){
    majOutput();
    await navigator.clipboard.writeText($("outputText").value);

}

/* -------- Génération d'une page HTML autonome (même rendu que l'aperçu) -------- */
function genererPageHTML(){

    // Le HTML embarque également son propre moteur de rendu :

    const pageData = {

        titre: page.titre || "",

    const format = FORMATS_PAGE[pageData.format] || FORMATS_PAGE.site;
    const dataJS = JSON.stringify(pageData)
        .replace(/</g, "\\u003c")
        .replace(/>/g, "\\u003e")
        .replace(/&/g, "\\u0026")
        .replace(/\u2028/g, "\\u2028")
        .replace(/\u2029/g, "\\u2029");

    return `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(page.titre || page.id || "Page")} — Archives de l'Ancien Monde</title>

<style>
:root {
    --bleu-noir: #1b2325;
    --bleu-ardoise: #2d393d;
    --texte-clair: #d8d1b8;
    --ligne: rgba(125,139,140,.5);
    --police-texte: ${s.policeTexte};
    --police-titres: ${s.policeTitres};
    --taille-texte: ${s.tailleTexte}px;
    --taille-titres: ${s.tailleTitres}px;
    --couleur-texte: ${s.couleurTexte};
    --couleur-titres: ${s.couleurTitres};
    --couleur-accent: ${s.couleurAccent};
    --page-width: ${format.cssWidth};
    --page-height: ${format.cssHeight};
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: linear-gradient(rgba(170,145,105,.72), rgba(170,145,105,.72)), url("images/fond-carte.jpg");
    background-size: cover;
    background-attachment: fixed;
    color: #252a29;
    font-family: "Vollkorn", Georgia, serif;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background:radial-gradient(circle at 20% 10%,#fff 0,transparent 24%),radial-gradient(circle at 80% 80%,#4d3c28 0,transparent 28%);mix-blend-mode:multiply}
.page-wrap {
    width: min(calc(100% - 40px), var(--page-width));
    max-width: var(--page-width);
    margin: 35px auto;
    display: flex;
    flex-direction: column;
    gap: 26px;
    align-items: center;
}
nav.retour { width: 100%; text-align: center; margin-bottom: -10px; }
nav.retour a { color: #3a352a; font-size: 13px; text-decoration: none; letter-spacing: 1px; }
a { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
.button {
    display: inline-block;
    padding: 8px 16px;
    border: 1px solid #9c9278;
    color: var(--texte-clair);
    background: rgba(25,32,34,.94);
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
}
.button:hover { filter: brightness(1.15); }
.button.disabled { opacity: .55; cursor: default; pointer-events: none; }
.p-hero, .p-texte, .p-image, .p-grille, .p-fiche, .p-carrousel, .p-footer {
    width: 100%;
    max-width: 900px;
}
.p-hero {
    padding: 34px;
    background: rgba(25,32,34,.94);
    border: 1px solid var(--ligne);
    color: var(--texte-clair);
    text-align: center;
}
.p-hero h1 {
    margin: 0 0 10px;
    font-family: var(--police-titres), Georgia, serif;
    font-size: var(--taille-titres);
    color: var(--couleur-titres);
}
.p-hero p { margin: 0 0 18px; color: #cfc7ab; }
.p-texte {
    padding: 25px 30px;
    background: rgba(245,238,215,.86);
    border: 1px solid #8f856e;
    color: var(--couleur-texte);
    font-size: var(--taille-texte);
}
.p-texte h2, .p-fiche h2, .p-grille h2 {
    font-family: var(--police-titres), Georgia, serif;

}
.p-image {
    text-align: center;
}
.p-image img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: auto;
}
.p-grille-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

}
.p-card {
    background: rgba(25,32,34,.94);
    border: 1px solid var(--ligne);

}
.p-card img { width: 100%; height: auto; margin-bottom: 12px; }
.p-card h3 { margin: 0 0 8px; font-family: var(--police-titres), Georgia, serif; }
.p-card p { margin: 0 0 12px; color: #cfc7ab; }
.p-fiche {
    background: rgba(25,32,34,.94);
    border: 1px solid var(--ligne);

}
.p-fiche h2 { margin-top: 0; }
.fiche-section { margin-top: 18px; }

}
.p-vignette {

}
.p-vignette:hover, .p-vignette.active { border-color: #b7975c; }
.p-vignette img {
    display: block;
    width: 100%;

    object-fit: cover;
    margin-bottom: 5px;
}
.p-carrousel-slide {
    display: flex;
    align-items: center;

    padding: 30px;
}
.p-carrousel-texte { flex: 1; text-align: left; }
.p-carrousel-texte h3 {
    font-family: "IM Fell English SC", Georgia, serif;

}
.p-carrousel-texte p { font-size: 14px; margin: 0 0 16px; color: #cfc7ab; }
.p-carrousel-image { width: 200px; flex-shrink: 0; }
.p-carrousel-image img { width: 100%; border: 1px solid #b7975c; }
.p-carrousel-fleche {
    background: none;
    border: none;
    color: var(--texte-clair);

}
.p-carrousel-fleche:hover { color: #fff; }
.p-carrousel-dots {
    display: flex;
    gap: 7px;
    justify-content: center;
    padding: 0 0 18px;
}
.p-dot {
    width: 9px;
    height: 9px;
    padding: 0;

}
.p-dot.active { background: #d0b16b; }
.p-footer {
    padding: 22px 24px;
    text-align: center;

}
.p-footer p { font-size: 13px; margin: 0 0 10px; color: #cfc7ab; }
.p-footer-liens { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.p-footer-lien { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--texte-clair); }
.rich-editable img, .p-texte img, .p-hero img, .p-card img, .p-fiche img, .p-carrousel-texte img, .p-footer img {
    max-width: 100%; height: auto; display: block; margin: 8px 0;
}
@media(max-width:650px) {
    .p-carrousel-slide { flex-direction: column; }
    .p-carrousel-image { width: min(100%, 300px); }
    .p-hero, .p-texte, .p-fiche { padding: 20px; }
}

/* Finition Indexa Administratorium */
.page-wrap{width:min(calc(100% - 36px),var(--page-width));margin:28px auto 34px}
.p-hero,.p-texte,.p-image,.p-grille,.p-fiche,.p-carrousel,.p-footer{box-shadow:0 5px 18px rgba(45,35,24,.18)}

.p-hero h1{font-family:"IM Fell English SC",Georgia,serif!important;color:#292824!important;letter-spacing:2px}.p-hero p{color:#554936}
.p-texte,.p-fiche{background:linear-gradient(145deg,#eee7d5,#e7dec7);border-color:rgba(72,59,42,.42)}

.card{position:relative;background:linear-gradient(145deg,#eee7d5,#e7dec7);border-color:rgba(72,59,42,.42);box-shadow:0 4px 13px rgba(45,35,24,.18);padding:13px 13px 15px;max-width:none;transition:transform .18s ease,box-shadow .18s ease}
.card::before{content:"";position:absolute;inset:5px;border:1px solid rgba(96,78,52,.18);pointer-events:none}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(45,35,24,.24)}
.card-carte-image{aspect-ratio:1/1;height:auto!important;object-fit:cover}
.card h3{font-family:"IM Fell English SC",Georgia,serif;font-size:20px;line-height:1.15}.card p{color:#655945}
.button{font-family:"Cinzel",Georgia,serif;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;background:rgba(42,39,32,.96);border-color:#76664d;color:#e9dfc5;box-shadow:0 2px 5px rgba(0,0,0,.12)}
</style>

<body>
<div class="page-wrap">
<nav class="retour"><a href="index.html">&larr; Retour aux Archives de l'Ancien Monde</a></nav>
<div id="page-root"></div>
</div>

<script>
/*
 * ARCHIVES DE L'ANCIEN MONDE
 * Moteur autonome de rendu des pages.
 * Les données de la page sont embarquées dans PAGE_DATA.
 * Aucun chargement de atelier-redaction.html ou de BLOC_TYPES externe.
 */
const FORMATS_PAGE_EXPORT = {
    site:{width:900,height:null}, large:{width:1200,height:null}, wide:{width:1400,height:null},
    "16-9":{width:1280,height:720}, "full-hd":{width:1920,height:1080}, mobile:{width:390,height:844},
    a4:{width:794,height:1123}, "a4-landscape":{width:1123,height:794},
    a5:{width:559,height:794}, "a5-landscape":{width:794,height:559},
    square:{width:1080,height:1080}, "9-16":{width:1080,height:1920}
};
const PAGE_DATA = ${dataJS};

function escHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(ch) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
}

function escAttr(value) {
    return escHTML(value);
}

function corpsHTML(value) {
    const str = String(value ?? "");
    if (!str.trim()) return "";
    if (/<[a-z][\s\S]*>/i.test(str)) return str;
    return str
        .split(/\\n\\s*\\n/)
        .filter(function(p){ return p.trim(); })
        .map(function(p){ return "<p>" + escHTML(p.trim()).replace(/\\n/g, "<br>") + "</p>"; })
        .join("");
}

function lienHTML(label, href, disabled) {
    if (disabled || !href) {
        return '<span class="button disabled">' + escHTML(label) + '</span>';
    }
    return '<a class="button" href="' + escAttr(href) + '">' + escHTML(label) + '</a>';
}

function renderHero(b) {
    const titre = b.titre || b.title || PAGE_DATA.titre || "";
    const texte = b.texte || b.description || b.contenu || "";
    const label = b.boutonLabel || "En savoir plus";
    return '<section class="p-hero">' +
        '<h1>' + escHTML(titre) + '</h1>' +
        corpsHTML(texte) +
        (b.lien ? '<div>' + lienHTML(label, b.lien, false) + '</div>' : '') +
        '</section>';
}

function renderTexte(b) {
    return '<section class="p-texte">' +
        (b.titre ? '<h2>' + escHTML(b.titre) + '</h2>' : '') +
        corpsHTML(b.texte || b.contenu || b.description || "") +
        '</section>';
}

function renderImage(b) {
    if (!b.image && !b.src) return "";
    const src = b.image || b.src;
    return '<section class="p-image">' +
        '<img src="' + escAttr(src) + '" alt="' + escAttr(b.alt || b.titre || "") + '">' +
        (b.legende ? '<p>' + escHTML(b.legende) + '</p>' : '') +
        '</section>';
}

function renderGrille(b) {
    const cartes = Array.isArray(b.cartes) ? b.cartes :
                   Array.isArray(b.cards) ? b.cards :
                   Array.isArray(b.elements) ? b.elements : [];
    return '<section class="p-grille">' +
        (b.titre ? '<h2>' + escHTML(b.titre) + '</h2>' : '') +
        '<div class="p-grille-grid">' +
        cartes.map(function(c) {
            const img = c.image ? '<img src="' + escAttr(c.image) + '" alt="' + escAttr(c.nom || c.titre || "") + '">' : '';
            const label = c.boutonLabel || "Ouvrir";
            const href = c.lien || c.url || "";
            return '<article class="p-card">' +
                img +
                '<h3>' + escHTML(c.nom || c.titre || "") + '</h3>' +
                corpsHTML(c.description || c.texte || "") +
                (href ? '<div>' + lienHTML(label, href, false) + '</div>' : '') +
                '</article>';
        }).join("") +
        '</div></section>';
}

function renderFiche(b) {
    const sections = Array.isArray(b.sections) ? b.sections : [];
    return '<section class="p-fiche">' +
        (b.titre ? '<h2>' + escHTML(b.titre) + '</h2>' : '') +
        (b.introduction ? corpsHTML(b.introduction) : '') +
        sections.map(function(s) {
            return '<div class="fiche-section">' +
                (s.titre ? '<h3>' + escHTML(s.titre) + '</h3>' : '') +
                corpsHTML(s.texte || s.contenu || "") +
                '</div>';
        }).join("") +
        '</section>';
}

function renderCarousel(b) {
    const slides = Array.isArray(b.slides) ? b.slides : [];
    if (!slides.length) {
        return '<section class="p-carrousel"><div class="p-carrousel-slide">Aucun élément dans le carrousel.</div></section>';
    }

    const id = "carrousel-" + Math.random().toString(36).slice(2, 10);

    return '<section class="p-carrousel" id="' + id + '" data-carousel>' +
        '<div class="p-carrousel-vignettes">' +
        slides.map(function(s, i) {
            return '<button type="button" class="p-vignette' + (i === 0 ? ' active' : '') + '" data-carousel-index="' + i + '">' +
                (s.image ? '<img src="' + escAttr(s.image) + '" alt="' + escAttr(s.nom || s.titre || "") + '">' : '') +
                '<span>' + escHTML(s.nom || s.titre || ("Élément " + (i + 1))) + '</span>' +
                '</button>';
        }).join("") +
        '</div>' +
        '<div class="p-carrousel-slide">' +
            '<button type="button" class="p-carrousel-fleche" data-carousel-prev aria-label="Précédent">&lsaquo;</button>' +
            '<div class="p-carrousel-texte" data-carousel-text></div>' +
            '<div class="p-carrousel-image" data-carousel-image></div>' +
            '<button type="button" class="p-carrousel-fleche" data-carousel-next aria-label="Suivant">&rsaquo;</button>' +
        '</div>' +
        '<div class="p-carrousel-dots">' +
            slides.map(function(s, i) {
                return '<button type="button" class="p-dot' + (i === 0 ? ' active' : '') + '" data-carousel-index="' + i + '" aria-label="Afficher ' + (i + 1) + '"></button>';
            }).join("") +
        '</div>' +
        '</section>';
}

function renderFooter(b) {
    const liens = Array.isArray(b.liens) ? b.liens :
                  Array.isArray(b.links) ? b.links : [];
    return '<footer class="p-footer">' +
        (b.texte ? corpsHTML(b.texte) : '') +
        '<div class="p-footer-liens">' +
        liens.map(function(l) {
            const label = l.label || l.nom || l.titre || "Lien";
            const href = l.lien || l.url || "#";
            return '<a class="p-footer-lien" href="' + escAttr(href) + '">' + escHTML(label) + '</a>';
        }).join("") +
        '</div></footer>';
}

const RENDERERS = {
    "hero": renderHero,
    "texte": renderTexte,
    "image": renderImage,
    "grille-cartes": renderGrille,
    "fiche-detaillee": renderFiche,
    "carrousel": renderCarousel,
    "pied-de-page": renderFooter
};

function renderBloc(b) {
    if (!b || !b.type) return "";
    const renderer = RENDERERS[b.type];
    if (!renderer) {
        console.warn("Type de bloc inconnu :", b.type);
        return "";
    }
    return renderer(b);
}

function renderPage() {
    const root = document.getElementById("page-root");
    root.innerHTML = (PAGE_DATA.blocs || []).map(renderBloc).join("");
    initCarrousels(root);
}

function initCarrousels(root) {
    root.querySelectorAll("[data-carousel]").forEach(function(carousel) {
        const block = PAGE_DATA.blocs.find(function(b) {
            return b && b.type === "carrousel";
        });
        const slides = block && Array.isArray(block.slides) ? block.slides : [];
        if (!slides.length) return;

        let index = 0;
        const text = carousel.querySelector("[data-carousel-text]");
        const image = carousel.querySelector("[data-carousel-image]");
        const thumbs = carousel.querySelectorAll("[data-carousel-index]");
        const prev = carousel.querySelector("[data-carousel-prev]");
        const next = carousel.querySelector("[data-carousel-next]");

        function draw() {
            const s = slides[index] || {};
            const titre = s.nom || s.titre || "";
            const description = s.description || s.texte || "";
            const statut = s.statut || "disponible";
            const label = s.boutonLabel || (statut === "bientot" ? "Bientôt disponible" : statut === "archive" ? "Archivé" : "Télécharger");
            const disabled = statut !== "disponible" || !s.lien;

            text.innerHTML =
                '<h3>' + escHTML(titre) + '</h3>' +
                corpsHTML(description) +
                lienHTML(label, s.lien || "", disabled);

            image.innerHTML = s.image
                ? '<img src="' + escAttr(s.image) + '" alt="' + escAttr(titre) + '">'
                : "";

            thumbs.forEach(function(el, i) {
                el.classList.toggle("active", Number(el.getAttribute("data-carousel-index")) === index);
            });
        }

        function go(n) {
            index = (n + slides.length) % slides.length;
            draw();
        }

        prev.addEventListener("click", function(){ go(index - 1); });
        next.addEventListener("click", function(){ go(index + 1); });
        thumbs.forEach(function(el) {
            el.addEventListener("click", function(){
                go(Number(el.getAttribute("data-carousel-index")));
            });
        });

        draw();
    });
}

renderPage();
<\/script>
</body>
</html>`;
}
function exporterHTML(){
    if(!page.blocs.length){ alert("Ajoutez au moins un bloc avant d'exporter le HTML."); return; }
    const html = genererPageHTML();
    const blob = new Blob([html], {type:"text/html"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (page.id || "page") + ".html";
    a.click();
    URL.revokeObjectURL(a.href);
    status(`Fichier téléchargé : ${a.download} — page HTML autonome, prête à déposer sur le site.`);
}

function toutTelecharger(){
    if(!page.id){ alert("Renseignez un identifiant de page (slug) avant d'exporter."); return; }
    if(!page.blocs.length){ alert("Ajoutez au moins un bloc avant d'exporter."); return; }
    exporterJSON();
    setTimeout(exporterHTML, 300);
    status("Téléchargement du JSON puis du HTML…");
}
$("importInput").addEventListener("change", e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
        try{
            const d = JSON.parse(reader.result);
            page = { id: d.id||"", titre: d.titre||"", description: d.description||"", format: FORMATS_PAGE[d.format] ? d.format : "site", style: d.style || styleParDefaut(), blocs: Array.isArray(d.blocs)?d.blocs:[] };
            selectedIndex = page.blocs.length ? 0 : null;
            $("pageId").value = page.id; $("pageTitre").value = page.titre; $("pageDescription").value = page.description;
            $("pageFormat").value = page.format || "site";
            renderTout();
            status("Page importée depuis le fichier JSON.");
        }catch(err){ alert("Import impossible : "+err.message); }
    };
    reader.readAsText(f); e.target.value = "";
});

function status(msg){ $("statusLine").textContent = msg; setTimeout(()=>{ if($("statusLine").textContent===msg) $("statusLine").textContent=""; }, 3500); }

/* =========================================================
   INIT
   ========================================================= */
(function init(){
    $("newBlocType").innerHTML = Object.entries(BLOC_TYPES).map(([key,def])=>`<option value="${key}">${esc(def.label)}</option>`).join("");
    renderTout();
})();
</script>
</body>
