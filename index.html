<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives du Courant</title>

    <!-- =========================================================
         POLICES
         ========================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================================
           VARIABLES
           ========================================================= */
        :root {
            --fond: #15191a;
            --bleu-noir: #1b2325;
            --bleu-ardoise: #2d393d;
            --bleu-gris: #435156;

            --parchemin: #c8bd9d;
            --parchemin-clair: #ded4b7;
            --parchemin-fonce: #a89d7e;

            --encre: #252a29;
            --encre-claire: #4b514f;

            --texte-clair: #d8d1b8;
            --argent: #91a6aa;

            --ligne: rgba(125, 139, 140, 0.50);
            --ombre: rgba(0, 0, 0, 0.45);

            --site-scale: 1;
        }

        /* =========================================================
           RESET
           ========================================================= */
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--encre);
            font-family: "Vollkorn", Georgia, serif;
            line-height: 1.65;
            background-color: var(--parchemin);
            background-image: linear-gradient(rgba(170, 145, 105, 0.72), rgba(170, 145, 105, 0.72)), url("images/fond-carte.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* =========================================================
           VIGNETTE
           ========================================================= */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(55, 38, 19, 0.20) 100%);
        }

        /* =========================================================
           CONTENEUR D'ÉCHELLE
           ========================================================= */
        .site-wrapper {
            width: 100%;
            transform: scale(var(--site-scale));
            transform-origin: top center;
            transition: transform 0.25s ease;
        }

        .site-content {
            width: 100%;
        }

        /* =========================================================
           CONTRÔLE DE TAILLE
           ========================================================= */
        .scale-control {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px;
            background: rgba(27, 35, 37, 0.96);
            border: 1px solid rgba(190, 170, 125, 0.45);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
        }

        .scale-control button {
            width: 36px;
            height: 34px;
            padding: 0;
            border: 1px solid transparent;
            background: transparent;
            color: #d8d1b8;
            font-family: "IM Fell English SC", Georgia, serif;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .scale-control button:hover {
            background: rgba(190,170,125,0.15);
            border-color: rgba(190,170,125,0.35);
        }

        #scale-value {
            min-width: 52px;
            text-align: center;
            color: #d8d1b8;
            font-size: 13px;
        }

        /* =========================================================
           PAGE & HEADER
           ========================================================= */
        .page {
            width: calc(100% - 40px);
            max-width: 1250px;
            margin: 30px auto;
        }

        header {
            position: relative;
            text-align: center;
            padding: 55px 30px 45px;
            background: linear-gradient(rgba(25, 32, 34, 0.88), rgba(30, 38, 40, 0.88)), url("images/fond-carte.jpg");
            background-size: cover;
            background-position: center;
            border: 1px solid var(--ligne);
            box-shadow: 0 8px 25px var(--ombre);
            margin-bottom: 40px;
        }

        header::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(210, 195, 160, 0.25);
            pointer-events: none;
        }

        header h1 {
            position: relative;
            margin: 0;
            color: #d8d1b8;
            font-family: "IM Fell English SC", Georgia, serif;
            font-size: clamp(38px, 6vw, 72px);
            font-weight: normal;
            letter-spacing: 7px;
            text-transform: uppercase;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.25);
        }

        header .subtitle {
            position: relative;
            margin: 15px 0 0;
            color: #aaa89b;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        header .ornament {
            position: relative;
            margin: 22px auto 0;
            width: 220px;
            height: 1px;
            background: var(--ligne);
        }

        header .ornament::before {
            content: "◆";
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            color: #d8d1b8;
            background: #1b2325;
            padding: 0 10px;
        }

        /* =========================================================
           STYLE NOUVEAU CARROUSEL INTERACTIF
           ========================================================= */
        .carousel-section {
            margin: 50px 0;
            text-align: center;
        }

        .section-title {
            font-family: "IM Fell English SC", Georgia, serif;
            color: #252a29;
            font-size: 28px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .carousel-container {
            position: relative;
            max-width: 1100px;
            margin: 0 auto;
            overflow: hidden; /* Cache les cartes de côté */
            padding: 10px 60px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            gap: 30px;
        }

        .carousel-card {
            /* Calcule la taille pour afficher 3 cartes sur grand écran */
            min-width: calc(100% / 3 - 20px); 
            background: rgba(244, 241, 234, 0.95);
            border: 1px solid rgba(45, 57, 61, 0.3);
            border-radius: 4px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-family: "IM Fell English SC", Georgia, serif;
            font-size: 22px;
            margin: 0 0 15px 0;
            color: var(--bleu-noir);
        }

        .card-image-placeholder {
            width: 100%;
            height: 260px;
            background: var(--bleu-ardoise);
            border: 1px solid var(--ligne);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d8d1b8;
            font-size: 14px;
        }

        .card-desc {
            font-size: 15px;
            color: var(--encre-claire);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .download-btn {
            background: var(--bleu-noir);
            color: #d8d1b8;
            border: 1px solid var(--ligne);
            padding: 10px 20px;
            font-family: "IM Fell English SC", Georgia, serif;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .download-btn:hover:not(:disabled) {
            background: var(--bleu-ardoise);
            color: #fff;
        }

        .download-btn:disabled {
            background: #ccc;
            color: #777;
            border-color: #bbb;
            cursor: not-allowed;
        }

        /* Flèches de navigation (Inspiration style interface de jeu) */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bleu-noir);
            color: #d8d1b8;
            border: 1px solid var(--ligne);
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .carousel-btn:hover {
            background: var(--bleu-ardoise);
            color: white;
