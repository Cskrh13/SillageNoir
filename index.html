<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sillage Noir — Archives de l'Ancien Monde</title>
<meta name="description" content="Archives de l'Ancien Monde — Sillage Noir.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Vollkorn:wght@400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>

:root {
    --ivory:#eee6d2;
    --gold:#b99b62;
    --night:#05080c;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--night);
}

body{
    font-family:"Vollkorn",Georgia,serif;
}


/* =========================================================
   INTRO
========================================================= */

.intro{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    isolation:isolate;
    background:#081017;
}


/* =========================================================
   BASE DES CALQUES
========================================================= */

.layer{
    position:absolute;
    pointer-events:none;
    user-select:none;
    will-change:transform;
}


/* =========================================================
   IMAGE PRINCIPALE — NAVIRE
========================================================= */

.navire{
    z-index:1;

    inset:-3%;

    width:106%;
    height:106%;

    object-fit:cover;
    object-position:center;

    filter:
        brightness(.78)
        contrast(1.08)
        saturate(.9);
}


/* =========================================================
   VAGUES
========================================================= */

/* Vagues principales */

.vague{
    z-index:4;

    left:-7%;
    width:114%;
    height:65%;

    bottom:-14%;

    object-fit:cover;
    object-position:center bottom;

    opacity:.70;

    /*
       Le masque fait disparaître progressivement
       le haut de l'image.

       Cela supprime la séparation horizontale.
    */

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0,0,0,.05) 12%,
            rgba(0,0,0,.35) 50%,
            rgba(0,0,0,.75) 80%,
            #000 78%
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0,0,0,.05) 12%,
            rgba(0,0,0,.35) 50%,
            rgba(0,0,0,.75) 80%,
            #000 78%
        );
}


/* =========================================================
   VAGUES ARRIÈRE
========================================================= */

.vague.back{
    z-index:2;

    left:-8%;
    width:116%;

    height:72%;

    bottom:-20%;

    opacity:.36;

    filter:blur(1px);

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0,0,0,.03) 18%,
            rgba(0,0,0,.20) 38%,
            rgba(0,0,0,.55) 60%,
            #000 82%
        );

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0,0,0,.03) 18%,
            rgba(0,0,0,.20) 38%,
            rgba(0,0,0,.55) 60%,
            #000 82%
        );
}


/* =========================================================
   BRUME
========================================================= */

.brume{
    z-index:6;

    inset:-8%;

    width:116%;
    height:116%;

    object-fit:cover;
    object-position:center;

    opacity:.40;

    filter:blur(.5px);
}


/* =========================================================
   PLUIE
========================================================= */

.pluie{
    z-index:8;

    inset:-5%;

    width:110%;
    height:110%;

    object-fit:cover;
    object-position:center;
}

.pluie.fine{
    opacity:.32;
}


/* =========================================================
   ASSOMBRISSEMENT GÉNÉRAL
========================================================= */

.overlay{
    position:absolute;
    inset:0;

    z-index:10;

    pointer-events:none;

    background:

        /* Assombrissement général */

        linear-gradient(
            180deg,

            rgba(0,0,0,.32) 0%,

            rgba(0,0,0,.08) 30%,

            rgba(0,0,0,.10) 55%,

            rgba(0,0,0,.72) 100%
        ),

        /* Vignette douce */

        radial-gradient(
            ellipse at center,

            transparent 0%,

            rgba(0,0,0,.06) 45%,

            rgba(0,0,0,.52) 100%
        );
}


/* =========================================================
   GRAIN CINÉMATOGRAPHIQUE
========================================================= */

.grain{
    position:absolute;
    inset:0;

    z-index:11;

    pointer-events:none;

    opacity:.14;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

    mix-blend-mode:soft-light;
}


/* =========================================================
   CONTENU
========================================================= */

.content{
    position:absolute;
    inset:0;

    z-index:20;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:35px 24px 55px;

    text-align:center;

    color:var(--ivory);
}


/* =========================================================
   KICKER
========================================================= */

.kicker{
    margin:0 0 18px;

    font-family:"Cinzel",serif;

    font-size:clamp(9px,1.2vw,12px);

    letter-spacing:.42em;

    text-transform:uppercase;

    color:#d7c294;

    text-shadow:0 2px 12px #000;

    opacity:0;

    transform:translateY(14px);

    animation:reveal .9s .4s forwards;
}


/* =========================================================
   LIGNE
========================================================= */

.rule{
    width:min(270px,70vw);

    height:1px;

    margin-bottom:20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );

    opacity:0;

    animation:fade 1s .75s forwards;
}


/* =========================================================
   TITRE
========================================================= */

h1{
    margin:0;

    max-width:min(1200px,95vw);

    font-family:
        "IM Fell English SC",
        Georgia,
        serif;

    /*
       Taille réduite légèrement car
       CHRONIQUES DE L'ANCIEN MONDE
       est beaucoup plus long que SILLAGE NOIR.
    */

    font-size:
        clamp(
            42px,
            7vw,
            112px
        );

    font-weight:400;

    letter-spacing:.055em;

    line-height:.92;

    color:#f3ead7;

    text-shadow:
        0 3px 22px rgba(0,0,0,.95),
        0 0 45px rgba(182,151,91,.16);

    opacity:0;

    transform:scale(.95);

    animation:title 1.4s .85s forwards;
}


/* =========================================================
   CITATION
========================================================= */

.tagline{
    width:min(590px,88vw);

    margin:28px auto 0;

    font-size:
        clamp(
            15px,
            1.7vw,
            21px
        );

    line-height:1.55;

    font-style:italic;

    color:
        rgba(
            241,
            233,
            215,
            .9
        );

    text-shadow:
        0 2px 12px #000;

    opacity:0;

    transform:
        translateY(14px);

    animation:
        reveal 1s 1.65s forwards;
}


/* =========================================================
   BOUTON
========================================================= */

.enter{
    margin-top:34px;

    display:inline-flex;

    align-items:center;

    gap:13px;

    padding:
        14px
        23px
        13px;

    color:#f0e5cd;

    text-decoration:none;

    text-transform:uppercase;

    font-family:"Cinzel",serif;

    font-size:10px;

    letter-spacing:.2em;

    border:
        1px solid
        rgba(205,177,112,.75);

    background:
        rgba(7,10,14,.42);

    box-shadow:
        inset 0 0 0 3px rgba(220,195,144,.08),
        0 7px 25px rgba(0,0,0,.42);

    backdrop-filter:
        blur(3px);

    opacity:0;

    transform:
        translateY(14px);

    animation:
        reveal 1s 2.25s forwards;

    transition:
        .25s ease;
}

.enter:hover{
    transform:
        translateY(-2px);

    background:
        rgba(62,49,29,.72);

    box-shadow:
        inset 0 0 0 3px rgba(220,195,144,.16),
        0 12px 30px rgba(0,0,0,.55);
}

.enter span{
    font-size:18px;
    line-height:0;
}


/* =========================================================
   INDICATION CURSEUR
========================================================= */

.hint{
    position:absolute;

    z-index:20;

    bottom:16px;

    left:50%;

    transform:
        translateX(-50%);

    font-family:"Cinzel",serif;

    font-size:8px;

    letter-spacing:.18em;

    text-transform:uppercase;

    color:
        rgba(230,220,195,.5);

    white-space:nowrap;

    opacity:0;

    animation:
        fade 1s 3s forwards;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes reveal{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fade{
    to{
        opacity:1;
    }
}

@keyframes title{
    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .navire{
        object-position:center center;
    }

    .vague{
        height:58%;
        bottom:-14%;
    }

    .vague.back{
        height:65%;
        bottom:-18%;
    }

    h1{
        font-size:
            clamp(
                38px,
                10vw,
                70px
            );

        letter-spacing:.025em;

        line-height:.95;
    }

    .kicker{
        letter-spacing:.24em;
    }

    .tagline{
        margin-top:22px;
    }

}


/* =========================================================
   ACCESSIBILITÉ
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        transition-duration:.01ms !important;

    }

}

</style>
</head>


<body>

<main class="intro" id="intro">


    <!-- IMAGE PRINCIPALE : NAVIRE -->

    <img
        class="layer navire"
        id="navire"
        src="images/intro/Fond.png"
        alt="Navire en pleine mer">


    <!-- VAGUE ARRIÈRE -->

    <img
        class="layer vague back"
        id="vague2"
        src="images/intro/vague1.png"
        alt="">


    <!-- VAGUE AVANT -->

     <img
        class="layer vague"
        id="vague1"
        src="images/intro/vague2.png"
        alt=""


    <!-- BRUME -->

    <img
        class="layer brume"
        id="brume"
        src="images/intro/Pluie2.png"
        alt="">


    <!-- PLUIE -->

    <img
        class="layer pluie fine"
        id="pluie1"
        src="images/intro/Pluie2.png"
        alt="">


    <!-- EFFETS -->

    <div class="overlay"></div>

    <div class="grain"></div>


    <!-- CONTENU -->

    <section class="content">

        <p class="kicker">
            Suppléments narratifs non officiels
        </p>

        <div class="rule"></div>


        <h1>
            CHRONIQUES DE L'ANCIEN MONDE
        </h1>


        <p class="tagline">
            « Les histoires oubliées ne disparaissent jamais.<br>
            Elles attendent simplement d'être racontées. »
        </p>


        <a
            class="enter"
            href="accueil.html">

            Ouvrir les Archives

            <span>→</span>

        </a>

    </section>


    <div class="hint">
        Déplacez le curseur
    </div>


</main>


<script>

/* =========================================================
   CALQUES POUR LA PARALLAXE
========================================================= */

const layers = [

    [
        document.getElementById("navire"),
        4
    ],

    [
        document.getElementById("vague2"),
        8
    ],

    [
        document.getElementById("vague1"),
        16
    ],

    [
        document.getElementById("brume"),
        22
    ],

    [
        document.getElementById("pluie1"),
        8
    ]

];


/* =========================================================
   POSITION SOURIS
========================================================= */

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;


window.addEventListener(
    "pointermove",

    event => {

        targetX =
            (
                event.clientX /
                window.innerWidth
                - .5
            ) * 2;

        targetY =
            (
                event.clientY /
                window.innerHeight
                - .5
            ) * 2;

    }
);


/* =========================================================
   ANIMATION PARALLAXE
========================================================= */

function parallax(){

    currentX +=
        (
            targetX -
            currentX
        ) * 0.045;


    currentY +=
        (
            targetY -
            currentY
        ) * 0.045;


    layers.forEach(
        ([element,depth]) => {

            if(!element) return;


            element.style.transform =
                `translate(
                    ${currentX * depth}px,
                    ${currentY * depth}px
                ) scale(1.04)`;

        }
    );


    requestAnimationFrame(
        parallax
    );

}


parallax();

</script>

</body>
</html>
