<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sillage Noir — Archives de l'Ancien Monde</title>
<meta name="description" content="Archives de l'Ancien Monde — Sillage Noir.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Vollkorn:wght@400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
    --ivory:#eee6d2;
    --gold:#b99b62;
    --night:#05080c;
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night)}
body{font-family:"Vollkorn",Georgia,serif}

.intro{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    isolation:isolate;
    background:#081017;
}

.layer{
    position:absolute;
    pointer-events:none;
    user-select:none;
    will-change:transform;
}

.navire{
    z-index:1;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    transform:scale(1.04);
    filter:brightness(.78) contrast(1.08) saturate(.9);
}

.vague{
    z-index:4;
    left:-7%;
    width:114%;
    height:58%;
    bottom:-12%;
    object-fit:cover;
    object-position:center bottom;
    mix-blend-mode:screen;
    opacity:.76;
}

.vague.back{
    z-index:2;
    bottom:-7%;
    height:50%;
    opacity:.42;
    filter:blur(.4px);
}

.brume{
    z-index:6;
    inset:-7%;
    width:114%;
    height:114%;
    object-fit:cover;
    object-position:center;
    mix-blend-mode:screen;
    opacity:.42;
    filter:blur(.5px);
}

.pluie{
    z-index:8;
    inset:-5%;
    width:110%;
    height:110%;
    object-fit:cover;
    object-position:center;
    mix-blend-mode:screen;
}

.pluie.fine{
    opacity:.30;
}

.pluie.forte{
    opacity:.20;
    transform:scale(1.04);
}

.overlay{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
    background:
        linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,.04) 38%,rgba(0,0,0,.18) 65%,rgba(0,0,0,.88) 100%),
        radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.48) 100%);
}

.grain{
    position:absolute;
    inset:0;
    z-index:11;
    pointer-events:none;
    opacity:.14;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    mix-blend-mode:soft-light;
}

.content{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:35px 24px 55px;
    text-align:center;
    color:var(--ivory);
}

.kicker{
    margin:0 0 18px;
    font-family:"Cinzel",serif;
    font-size:clamp(9px,1.2vw,12px);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:#d7c294;
    text-shadow:0 2px 12px #000;
    opacity:0;
    transform:translateY(14px);
    animation:reveal .9s .4s forwards;
}

.rule{
    width:min(270px,70vw);
    height:1px;
    margin-bottom:18px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:0;
    animation:fade 1s .75s forwards;
}

h1{
    margin:0;
    font-family:"IM Fell English SC",Georgia,serif;
    font-size:clamp(54px,10vw,145px);
    font-weight:400;
    letter-spacing:.075em;
    line-height:.9;
    color:#f3ead7;
    text-shadow:0 3px 22px rgba(0,0,0,.95),0 0 45px rgba(182,151,91,.16);
    opacity:0;
    transform:scale(.95);
    animation:title 1.4s .85s forwards;
}

.tagline{
    width:min(590px,88vw);
    margin:28px auto 0;
    font-size:clamp(15px,1.7vw,21px);
    line-height:1.55;
    font-style:italic;
    color:rgba(241,233,215,.9);
    text-shadow:0 2px 12px #000;
    opacity:0;
    transform:translateY(14px);
    animation:reveal 1s 1.65s forwards;
}

.enter{
    margin-top:34px;
    display:inline-flex;
    align-items:center;
    gap:13px;
    padding:14px 23px 13px;
    color:#f0e5cd;
    text-decoration:none;
    text-transform:uppercase;
    font-family:"Cinzel",serif;
    font-size:10px;
    letter-spacing:.2em;
    border:1px solid rgba(205,177,112,.75);
    background:rgba(7,10,14,.42);
    box-shadow:inset 0 0 0 3px rgba(220,195,144,.08),0 7px 25px rgba(0,0,0,.42);
    backdrop-filter:blur(3px);
    opacity:0;
    transform:translateY(14px);
    animation:reveal 1s 2.25s forwards;
    transition:.25s ease;
}

.enter:hover{
    transform:translateY(-2px);
    background:rgba(62,49,29,.72);
    box-shadow:inset 0 0 0 3px rgba(220,195,144,.16),0 12px 30px rgba(0,0,0,.55);
}

.enter span{font-size:18px;line-height:0}

.hint{
    position:absolute;
    z-index:20;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    font-family:"Cinzel",serif;
    font-size:8px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(230,220,195,.5);
    white-space:nowrap;
    opacity:0;
    animation:fade 1s 3s forwards;
}

@keyframes reveal{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes title{to{opacity:1;transform:scale(1)}}

@media(max-width:700px){
    .navire{object-position:center center;transform:scale(1.13)}
    .layer:not(.navire){transform:scale(1.12)}
    h1{letter-spacing:.04em}
    .kicker{letter-spacing:.27em}
    .vague{height:50%;bottom:-8%}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>
<main class="intro" id="intro">

    <!-- 1. Image principale : navire -->
    <img class="layer navire" id="navire" src="https://i.ibb.co/jkVd4N76/916d8d70d10f4f74ba4e18d5b1c05856-tplv-tnf8g33v4j-ai-watermark-resize-2508-1672.png" alt="Navire en pleine mer">

    <!-- 6. Vague arrière -->
    <img class="layer vague back" id="vague2" src="https://i.ibb.co/cK04MkJW/f8df612345334802a657966f9e647e2c-tplv-tnf8g33v4j-ai-watermark-resize-2508-1672-1.png" alt="">

    <!-- 5. Vague avant -->
    <img class="layer vague" id="vague1" src="https://i.ibb.co/Lz0mM6bp/foreground-ocean-waves-04-1.png" alt="">

    <!-- 4. Brume -->
    <img class="layer brume" id="brume" src="https://i.ibb.co/93sZhWW8/rain-PNG13467-1.png" alt="">

    <!-- 2. Première couche de pluie -->
    <img class="layer pluie fine" id="pluie1" src="https://i.ibb.co/d01cLBmS/9-2-rain-transparent-png.png" alt="">


    <div class="overlay"></div>
    <div class="grain"></div>

    <section class="content">
        <p class="kicker">Archives de l'Ancien Monde</p>
        <div class="rule"></div>

        <h1>Sillage Noir</h1>

        <p class="tagline">
            « Les histoires oubliées ne disparaissent jamais.<br>
            Elles attendent simplement d'être racontées. »
        </p>

        <!-- Change accueil.html si ta future page publique porte un autre nom -->
        <a class="enter" href="accueil.html">
            Ouvrir les Archives <span>→</span>
        </a>
    </section>

    <div class="hint">Déplacez le curseur</div>
</main>

<script>
const intro = document.getElementById("intro");

const layers = [
    [document.getElementById("navire"), 4],
    [document.getElementById("vague2"), 10],
    [document.getElementById("vague1"), 18],
    [document.getElementById("brume"), 25],
    [document.getElementById("pluie1"), 7],
    [document.getElementById("pluie2"), 12]
];

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

window.addEventListener("pointermove", event => {
    targetX = (event.clientX / window.innerWidth - 0.5) * 2;
    targetY = (event.clientY / window.innerHeight - 0.5) * 2;
});

function parallax() {
    currentX += (targetX - currentX) * 0.045;
    currentY += (targetY - currentY) * 0.045;

    layers.forEach(([element, depth]) => {
        if (!element) return;
        element.style.transform =
            `translate(${currentX * depth}px, ${currentY * depth}px) scale(1.04)`;
    });

    requestAnimationFrame(parallax);
}

parallax();
</script>
</body>
</html>
